[project]
name = "navermap-converter"
version = "0.1.0"
description = "PDF·엑셀·텍스트에서 한국 주소를 추출하고 네이버 지도에 비공개 리스트를 자동 생성·저장하는 로컬 웹 앱"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pdfplumber==0.11.0",
    "pdf2image==1.17.0",
    "pytesseract==0.3.10",
    "openpyxl==3.1.2",
    "pandas==2.2.2",
    "playwright==1.44.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "cryptography>=42.0.0",
    "reportlab==4.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
]

[tool.uv]
package = false
